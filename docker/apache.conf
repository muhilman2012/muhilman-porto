ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html/public">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [END]
</Directory>
<LocationMatch "(^|/)\.(?!well-known(?:/|$))">
    Require all denied
</LocationMatch>

Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
<If "osenv('GTM_CONTAINER_ID') =~ /^GTM-[A-Z0-9]+$/ || osenv('GA4_MEASUREMENT_ID') =~ /^G-[A-Z0-9]+$/">
    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self' https://www.googletagmanager.com; img-src 'self' https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.google.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
    Header always edit Content-Security-Policy "object-src 'none'" "object-src 'none'; frame-src https://www.googletagmanager.com" "expr=osenv('GTM_CONTAINER_ID') =~ /^GTM-[A-Z0-9]+$/"
</If>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Cross-Origin-Opener-Policy "same-origin"

AddType font/woff2 .woff2
AddOutputFilterByType DEFLATE text/html text/css image/svg+xml
<Directory "/var/www/html/public/assets">
    ExpiresActive On
    ExpiresDefault "access plus 1 day"
</Directory>

